version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Vitest 5 needs Node 22+ (and @types/node 22+) and Vite 7 needs Node 20.19+: stay on Vitest 4 / Vite 6 while Node 20 is supported
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is outside the typescript-eslint peer range (8.72.1: >=4.8.4 <6.1.0) and breaks npm ci; revisit when typescript-eslint supports it
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
